apiVersion: apps/v1
kind: Deployment
metadata:
  name: medx
  namespace: medx
  labels:
    app: medx-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medx-app
  template:
    metadata:
      labels:
        app: medx-app
    spec:
      containers:
        - name: medx-container
          image: anuragx048/medx
          env:
            - name: DATABASE_URL
              value: "postgresql://anuragxjarvis:Admin%40123@postgres:5432/postgres"
            - name: REDIS_URL
              value: "redis://redis:6379/1"
---
apiVersion: v1
kind: Service
metadata:
  name: medx
spec:
  selector:
    app: medx-app
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP